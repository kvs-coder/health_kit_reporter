name: Release

on:
  push:
    branches: [ master ]

permissions:
  actions: write # starts publish.yml
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      # A PAT / GitHub App token (RELEASE_PLEASE_TOKEN) lets the release PR trigger CI;
      # publishing doesn't need it, see the last step.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release PR
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # release-please writes '## [X.Y.Z](compare-url) (yyyy-MM-dd)' and '### ⚠ BREAKING CHANGES';
      # the project format (checked by CI's release guard) is '## [X.Y.Z] - dd.MM.yyyy'
      - name: Format CHANGELOG.md headers
        if: ${{ steps.release.outputs.pr }}
        run: |
          sed -E -i \
            -e 's/^## \[?([0-9]+\.[0-9]+\.[0-9]+)\]?(\([^)]*\))? \(([0-9]{4})-([0-9]{2})-([0-9]{2})\)$/## [\1] - \5.\4.\3/' \
            -e 's/^### ⚠ BREAKING CHANGES$/### BREAKING CHANGES/' \
            CHANGELOG.md
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: format changelog" CHANGELOG.md
            git push
          fi

      # Merging the release PR creates the tag with GITHUB_TOKEN, which doesn't trigger publish.yml's push event;
      # a workflow_dispatch on the tag does, and pub.dev accepts it for tags matching v{{version}}
      - name: Publish to pub.dev
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.release.outputs.tag_name }}"
