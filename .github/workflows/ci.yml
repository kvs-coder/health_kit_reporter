name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Minimum Dart line coverage of lib/ in percent
  COVERAGE_THRESHOLD: "90.0"

jobs:
  release-guard:
    name: Version / Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Top CHANGELOG.md entry matches pubspec.yaml
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          header=$(grep -m1 '^## ' CHANGELOG.md)
          echo "pubspec: $version, changelog: $header"
          [[ "$header" =~ ^"## [$version] - "[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]] || {
            echo "::error file=CHANGELOG.md,line=1::Expected '## [$version] - dd.MM.yyyy', got '$header'"
            exit 1
          }

  dart:
    name: Analyze / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Coverage gate
        run: |
          coverage=$(awk -F'[:,]' '/^DA:/ { total++; if ($3 > 0) hit++ } END { printf "%.1f", 100 * hit / total }' coverage/lcov.info)
          echo "lib coverage: $coverage%, threshold: $COVERAGE_THRESHOLD%"
          awk -v c="$coverage" -v t="$COVERAGE_THRESHOLD" 'BEGIN { exit !(c >= t) }' || {
            echo "::error::Dart line coverage $coverage% is below the $COVERAGE_THRESHOLD% threshold"
            exit 1
          }
      - name: Test the example
        working-directory: example
        run: flutter test

  example:
    name: Example (SwiftPM build, Swift tests, integration)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # HealthKitReporter 4 uses iOS 26 APIs, so it needs the Xcode 26 SDK
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Build
        working-directory: example
        run: flutter build ios --no-codesign
      # Any available iPhone simulator of the runner's Xcode
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone[^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - name: Swift unit tests (RunnerTests)
        working-directory: example
        run: |
          flutter build ios --config-only --simulator --debug
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "id=$SIMULATOR" -only-testing:RunnerTests
      # The authorization sheet can't be answered in CI, so only the rows that need
      # no authorization run here; the full catalog stays a manual run (AGENTS.md §6C)
      - name: Integration test (rows without authorization)
        working-directory: example
        run: flutter test integration_test -d "$SIMULATOR" --dart-define=NO_AUTHORIZATION=true

  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: command -v swiftlint || brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict
