name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Minimum Dart line coverage of lib/ in percent. Only ever raise it, to the level the latest test PR reaches.
  COVERAGE_THRESHOLD: "93.0"

jobs:
  release-guard:
    name: Version / Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Top CHANGELOG.md entry matches pubspec.yaml
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          header=$(grep -m1 '^## ' CHANGELOG.md)
          echo "pubspec: $version, changelog: $header"
          [[ "$header" =~ ^"## [$version] - "[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]] || {
            echo "::error file=CHANGELOG.md,line=1::Expected '## [$version] - dd.MM.yyyy', got '$header'"
            exit 1
          }

  dart:
    name: Analyze / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Coverage gate
        run: |
          coverage=$(awk -F'[:,]' '/^DA:/ { total++; if ($3 > 0) hit++ } END { printf "%.1f", 100 * hit / total }' coverage/lcov.info)
          echo "lib coverage: $coverage%, threshold: $COVERAGE_THRESHOLD%"
          awk -v c="$coverage" -v t="$COVERAGE_THRESHOLD" 'BEGIN { exit !(c >= t) }' || {
            echo "::error::Dart line coverage $coverage% is below the $COVERAGE_THRESHOLD% threshold"
            exit 1
          }
      - name: Test the example
        working-directory: example
        run: flutter test

  example:
    name: Example (SwiftPM build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # HealthKitReporter 4 uses iOS 26 APIs, so it needs the Xcode 26 SDK
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Build
        working-directory: example
        run: flutter build ios --no-codesign
