name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test the example
        working-directory: example
        run: flutter test
      - name: Build the example with Swift Package Manager
        working-directory: example
        run: flutter build ios --no-codesign
