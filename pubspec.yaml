name: health_kit_reporter
description: Reads, writes and observes Apple Health data on iOS through HealthKit, wrapping the Swift library HealthKitReporter.
version: 4.0.0
homepage: https://github.com/kvs-coder/health_kit_reporter
repository: https://github.com/kvs-coder/health_kit_reporter
issue_tracker: https://github.com/kvs-coder/health_kit_reporter/issues
topics:
  - health
  - healthkit
  - ios
  - apple-health

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SwiftHealthKitReporterPlugin
